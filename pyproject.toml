[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tomak136", email = "tomak1369t@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "boto3>=1.44.5",
    "fastapi[standard]>=0.143.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
